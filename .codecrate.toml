[codecrate]
output = "context_lexcompact.md"
keep_docstrings = true
dedupe = true
respect_gitignore = true
exclude = ["*/.venv/*", "context_lexcompact.*"]
include = [
  "**/*.py",
  "**/*.toml",
  "**/*.rst",
  "**/*.md",
  "**/*.json",
  "**/*.jsonl",
  "**/*.ipynb",
  "**/*.txt",
  "**/*.yaml",
  "**/*.yml",
  "**/*.tsv",
  "**/py.typed",
  ".gitignore",
  "LICENSE*",
  "MANIFEST.in",
  "NOTICE*",
]
split_max_chars = 2500000
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
