name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Generate coverage report
        run: python -m pytest --cov=g2lex --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json --cov-fail-under=90
      - name: Enforce branch coverage floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          branch = float(json.loads(Path("coverage.json").read_text())["totals"]["percent_branches_covered"])
          if branch < 80:
              raise SystemExit(f"branch coverage {branch:.2f}% is below 80%")
          print(f"branch coverage: {branch:.2f}%")
          PY
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
