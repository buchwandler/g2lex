# Build and publish a Python package when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

  id-token: write
jobs:
  deploy:
    environment:
      name: pypi
      url: https://pypi.org/p/g2lex
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: |
          rm -rf dist build g2lex.egg-info
          python -m build

      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"release tag must be vX.Y.Z, got {tag!r}")
          expected = tag[1:]
          subprocess.run(
              [sys.executable, "scripts/check_dist_versions.py", "--expected-version", expected],
              check=True,
          )
          PY
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
