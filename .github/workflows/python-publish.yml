# Build and publish a Python package when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

  id-token: write
jobs:
  deploy:
    environment:
      name: pypi
      url: https://pypi.org/p/g2lex
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Validate release artifacts
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheel = next(Path("dist").glob("g2lex-0.1.0-*.whl"))
          sdist = Path("dist/g2lex-0.1.0.tar.gz")
          assert sdist.exists(), sdist
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read("g2lex-0.1.0.dist-info/METADATA").decode()
          assert "Version: 0.1.0" in metadata
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/PKG-INFO") for name in archive.getnames())
          print(wheel)
          print(sdist)
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
