name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,benchmark]"
      - name: Test
        run: python -m pytest
      - name: CLI smoke
        run: |
          lexcompact --version
          lexcompact reduce benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/toy.lxc --format tsv --profile de-linkers
          lexcompact verify benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/toy.lxc --format tsv

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: lexcompact --version
