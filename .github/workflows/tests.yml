name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,benchmark]"
      - name: Test
        run: python -m pytest
      - name: CLI smoke
        run: |
          g2lex --version
          g2lex pack benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/toy.g2lex --format tsv
          g2lex verify benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/toy.g2lex --format tsv

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/g2lex-wheel
          /tmp/g2lex-wheel/bin/python -m pip install dist/g2lex-*.whl
          /tmp/g2lex-wheel/bin/g2lex --version
          /tmp/g2lex-wheel/bin/g2lex pack benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/wheel.g2lex --format tsv
          /tmp/g2lex-wheel/bin/g2lex verify benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/wheel.g2lex --format tsv
      - name: Sdist smoke test
        run: |
          python -m venv /tmp/g2lex-sdist
          /tmp/g2lex-sdist/bin/python -m pip install dist/g2lex-*.tar.gz
          /tmp/g2lex-sdist/bin/g2lex --version
          /tmp/g2lex-sdist/bin/g2lex pack benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/sdist.g2lex --format tsv
          /tmp/g2lex-sdist/bin/g2lex verify benchmarks/de_lexicon_entry_reduction/fixtures/toy.tsv /tmp/sdist.g2lex --format tsv

  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and documentation dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Build JSON documentation
        run: python -m sphinx -W --keep-going -b json docs docs/_build/json
