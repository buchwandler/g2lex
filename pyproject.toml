[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g2lex"
description = "Lossless, mmap-friendly compiled pronunciation lexicons for G2P, TTS, ASR, and speech tooling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Holger Nahrstaedt"}]
keywords = [
  "g2p",
  "grapheme-to-phoneme",
  "pronunciation",
  "pronunciation-dictionary",
  "lexicon",
  "phoneme",
  "tts",
  "speech",
  "asr",
  "forced-alignment",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.12", "tomli>=2; python_version < '3.11'"]
benchmark = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
g2lex = "g2lex.cli:main"

[project.urls]
Repository = "https://github.com/buchwandler/g2lex"
Issues = "https://github.com/buchwandler/g2lex/issues"
Changelog = "https://github.com/buchwandler/g2lex/blob/main/docs/changelog.md"
Documentation = "https://github.com/buchwandler/g2lex/tree/main/docs"

[tool.setuptools.dynamic]
version = {attr = "g2lex._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["g2lex*"]
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
g2lex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/de_lexicon_entry_reduction/tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: optional large-data benchmark"]

[tool.ruff]
line-length = 100
target-version = "py310"
