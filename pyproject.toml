[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexcompact"
description = "Lossless resident-entry reduction for pronunciation lexicons"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Holger Nahrstaedt"}]
keywords = ["lexicon", "phoneme", "pronunciation", "g2p", "compression", "tts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
benchmark = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
lexcompact = "lexcompact.cli:main"

[project.urls]
Repository = "https://github.com/buchwandler/lexcompact"
Issues = "https://github.com/buchwandler/lexcompact/issues"

[tool.setuptools.dynamic]
version = {attr = "lexcompact._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["lexcompact*"]
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
lexcompact = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/de_lexicon_entry_reduction/tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["slow: optional large-data benchmark"]

[tool.ruff]
line-length = 100
target-version = "py310"
