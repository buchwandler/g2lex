    observed_behavior:
      Introduces explicit-local-source lexicon comparison and layered-cascade
      benchmark tooling with deterministic JSON and TSV reports, including variant,
      collision, Unicode, and coverage metrics. Adds deterministic outer-compression
      measurements and an experimental interned literal store that preserves exact keys,
      ordered duplicate variants, and round trips; the documentation keeps that backend
      outside stable G2LX serialization.
